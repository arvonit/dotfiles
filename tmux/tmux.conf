# Fix colors
set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',xterm-256color:Tc'
# set-option -sa terminal-overrides ",xterm-kitty:RGB"

# Enable shift enter
set -s extended-keys on

# Enable focus events for nvim
set-option -g focus-events on

# Set scroll history to 100,000 lines
set-option -g history-limit 1000000

# Change Ctrl+b hotkey to Ctrl+a (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Avoid escape delay
set -s escape-time 0

# Display current command in terminal titlebar
set -g set-titles on
set -g set-titles-string "#T"

# Enable mouse support
set -g mouse on

# Make scrolling slower (3 lines per scroll instead of the default 5)
bind -T copy-mode-vi WheelUpPane send -N3 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N3 -X scroll-down

# Use vim keybindings
# Press Ctrl+a and [ to go to normal/copy mode and Enter to go back to insert mode
set-window-option -g mode-keys vi

# Configure vim keybindings for copy mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind-key -T copy-mode-vi 'C-j' send-keys -X clear-selection

# Hold mouse selection instead of immediately copying it
# Copied from here: https://github.com/s-valent/dotfiles/blob/d0e3587ba26e62d941ec2b03997f24dc42fe0794/tmux/tmux.conf#L27-L44
bind-key -T copy-mode-vi Escape send-keys -X clear-selection
unbind-key -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word
bind-key -T root DoubleClick1Pane select-pane -t = \; \
	if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
		{ send-keys -M } { copy-mode -H ; send-keys -X select-word }
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line
bind-key -T root TripleClick1Pane select-pane -t = \; \
	if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
		{ send-keys -M } { copy-mode -H ; send-keys -X select-line }

# Select panes with vim controls
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize pane with vim controls
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

# Start window/pane number at 1 to make it easier to type
set -g base-index 1
setw -g pane-base-index 1

# Create new panes in the same directory
bind "\"" split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Renumber windows to be in order after closing one
set -g renumber-windows on

# Avoid date/time taking up space
set -g status-right ''
set -g status-right-length 0

# Make max ssesion name length longer
set -g status-left-length 20

# Add rounded corners to popups
set -g popup-border-lines rounded

# Gruvbox theme (https://github.com/tinted-theming/base16-tmux)
# default statusbar colors
set-option -g status-style "fg=#bdae93,bg=#3c3836"
# default window title colors
set-window-option -g window-status-style "fg=#bdae93,bg=default"
# active window title colors
set-window-option -g window-status-current-style "fg=#fabd2f,bg=default"
# pane border
set-option -g pane-border-style "fg=#3c3836"
set-option -g pane-active-border-style "fg=#504945"
# message text
set-option -g message-style "fg=#d5c4a1,bg=#3c3836"
# pane number display
set-option -g display-panes-active-colour "#b8bb26"
set-option -g display-panes-colour "#fabd2f"
# clock
set-window-option -g clock-mode-colour "#b8bb26"
# copy mode highlight
set-window-option -g mode-style "fg=#bdae93,bg=#504945"
# bell
set-window-option -g window-status-bell-style "fg=#3c3836,bg=#fb4934"

# Custom tweaks
# popups
set -g popup-border-style "fg=#504945"
